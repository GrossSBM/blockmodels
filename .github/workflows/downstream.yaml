# Check the packages built on blockmodels (sbm, missSBM) against the version of
# blockmodels on the current branch, to catch the changes that break them.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: downstream.yaml

permissions: read-all

jobs:
  downstream:
    runs-on: ubuntu-latest

    name: ${{ matrix.package }} (${{ matrix.ref }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - {package: sbm,     ref: master}
          - {package: missSBM, ref: master}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - name: Checkout blockmodels
        uses: actions/checkout@v6
        with:
          path: blockmodels

      - name: Checkout ${{ matrix.package }}
        uses: actions/checkout@v6
        with:
          repository: GrossSBM/${{ matrix.package }}
          ref: ${{ matrix.ref }}
          path: downstream

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # a Remotes field pointing to another version of blockmodels would
      # conflict with the version under test
      - name: Drop the Remotes field of ${{ matrix.package }}
        shell: Rscript {0}
        run: |
          d <- read.dcf("downstream/DESCRIPTION", keep.white = TRUE)
          write.dcf(d[, colnames(d) != "Remotes", drop = FALSE], "downstream/DESCRIPTION", keep.white = TRUE)

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: downstream
          extra-packages: any::rcmdcheck, local::../blockmodels
          needs: check
          # own cache prefix: the other workflows must not restore this library (sbm, igraph...)
          # without the system libraries installed here (e.g. libglpk for igraph)
          cache-version: downstream

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: downstream
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          args: 'c("--no-manual", "--ignore-vignettes")'
          upload-snapshots: true
